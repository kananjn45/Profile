<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanan Jain — Developer, Creative Builder & BCA Student</title>
  <meta name="description"
    content="Portfolio of Kanan Jain — Building thoughtful web applications, accessible tools, and practical AI solutions. Developer and student based in Delhi.">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- FontAwesome Icons (Clean Vector SVG Icons Only) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous">

  <!-- Tailwind CSS CDN with Custom Palette & Dark Mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'Consolas', 'monospace']
          },
          colors: {
            palette: {
              linen: '#FEFAF3',
              blush: '#F6E2E9',
              sage: '#B8CFB3',
              moss: '#84A282',
              forest: '#4D684B',
              darkest: '#1C241E',
              secondary: '#4A564C'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel for Clean In-Browser Rendering -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

      <link rel="icon" href="assets/favicon.ico">

      <style>
        /* Base typography smooth anti-aliasing */
        body {
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
        }
      </style>
      </head>

      <body class="bg-[#FEFAF3] dark:bg-[#141A15] transition-colors duration-300">

        <!-- Root Container for React App -->
        <div id="root"></div>

  <!-- React Application Component -->
  <script type="text/babel" data-type="module" src="app.jsx"></script>
</body>

</html>
